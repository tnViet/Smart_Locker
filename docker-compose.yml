services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: locker
      POSTGRES_USER: locker
      POSTGRES_PASSWORD: locker
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locker -d locker"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  # Hai may chu mo phong source1, source2 do TV7 them sau

volumes:
  db_data:
